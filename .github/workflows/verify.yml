name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Restore, build and run tests
        shell: pwsh
        run: ./scripts/verify.ps1 -Configuration '${{ matrix.configuration }}' -Platform x64 -InProcess
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.configuration }}-x64
          path: |
            artifacts/build-*.log
            artifacts/test-results/*.json
            artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7
